server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 138.124.14.93;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/aeza-acme; }
    location / { return 308 https://138.124.14.93$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 138.124.14.93;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/aeza-renewals-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeza-renewals-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AEZA:10m;
    ssl_session_timeout 1d;
    client_max_body_size 64k;
    location ~ /\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
